<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhukad Hut - Menu & Order</title>
    <meta name="description" content="Welcome to Bhukad Hut, Hapur. Order your favorite fast food, rolls, pasta, and more.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <style>
:root {
    --primary: #FF5A00;
    --primary-hover: #E04E00;
    --bg-dark: #121212;
    --bg-card: #1E1E1E;
    --text-main: #FFFFFF;
    --text-muted: #A0A0A0;
    --glass-bg: rgba(30, 30, 30, 0.7);
    --glass-border: rgba(255, 255, 255, 0.1);
    --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Outfit', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    line-height: 1.5;
}

/* Typography */
h1, h2, h3 {
    font-weight: 800;
}

/* =========================================================
   Hero / Home Section 
========================================================= */
.hero-section {
    position: relative;
    padding: 3rem 1.5rem;
    text-align: center;
    background: linear-gradient(135deg, #1f1c18 0%, #8e0e00 100%);
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.hero-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(18,18,18,0.7) 100%);
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
}

.brand-title {
    font-size: 3rem;
    background: linear-gradient(to right, #f12711, #f5af19);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
    text-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.brand-subtitle {
    font-size: 1rem;
    color: #ffdcb5;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* =========================================================
   Order Type Toggle
========================================================= */
.order-type-container {
    padding: 0 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: center;
}

.order-type-toggle {
    display: flex;
    background: var(--bg-card);
    border-radius: 30px;
    padding: 0.3rem;
    border: 1px solid var(--glass-border);
    width: 100%;
    max-width: 350px;
}

.toggle-btn {
    flex: 1;
    padding: 0.8rem;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-weight: 600;
    font-size: 1rem;
    border-radius: 25px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
}

.toggle-btn i {
    font-size: 1.2rem;
}

.toggle-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 5px 15px rgba(255, 90, 0, 0.3);
}

/* =========================================================
   Categories 
========================================================= */
.categories-wrapper {
    padding: 0.5rem 0 1.5rem 0;
    position: sticky;
    top: 0;
    background: var(--bg-dark);
    z-index: 10;
}

.categories {
    display: flex;
    overflow-x: auto;
    gap: 1rem;
    padding: 0 1.5rem;
    scrollbar-width: none; /* Firefox */
}
.categories::-webkit-scrollbar {
    display: none; /* Chrome */
}

.category-btn {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    padding: 0.6rem 1.2rem;
    border-radius: 30px;
    white-space: nowrap;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition);
}

.category-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

/* =========================================================
   Menu Container 
========================================================= */
.menu-container {
    padding: 0 1.5rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 1rem;
    border: 1px solid var(--glass-border);
    transition: var(--transition);
}

.menu-item-info {
    flex: 1;
    padding-right: 1rem;
}

.menu-item-title {
    font-size: 1.1rem;
    margin-bottom: 0.3rem;
}

.menu-item-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.menu-item-price {
    font-weight: 800;
    color: var(--primary);
    font-size: 1.1rem;
}

/* Quantity Control */
.qty-control {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--bg-dark);
    padding: 0.3rem;
    border-radius: 30px;
    border: 1px solid var(--glass-border);
}

.qty-btn {
    background: var(--bg-card);
    color: var(--text-main);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 1rem;
    transition: var(--transition);
}

.qty-btn:active {
    transform: scale(0.9);
}

.qty-btn.add-btn {
    background: var(--primary);
    color: white;
}

.qty-display {
    font-weight: 600;
    min-width: 20px;
    text-align: center;
}

.add-init-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.add-init-btn:active {
    transform: scale(0.95);
}

.spacer {
    height: 100px;
}

/* =========================================================
   Cart Elements 
========================================================= */
.cart-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 400px;
    background: var(--primary);
    color: white;
    border-radius: 16px;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 10px 25px rgba(255, 90, 0, 0.4);
    cursor: pointer;
    z-index: 50;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
}

.cart-bar.hidden {
    transform: translate(-50%, 150px);
    opacity: 0;
    pointer-events: none;
}

.cart-info {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-weight: 600;
    font-size: 1.1rem;
}

.cart-total {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 800;
    font-size: 1.2rem;
}

/* Cart Modal */
.cart-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
}

.cart-modal.open {
    opacity: 1;
    pointer-events: all;
}

.cart-modal-content {
    background: var(--bg-card);
    border-radius: 24px 24px 0 0;
    padding: 2rem;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
}

.cart-modal.open .cart-modal-content {
    transform: translateY(0);
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.close-btn {
    background: var(--bg-dark);
    color: var(--text-main);
    border: 1px solid var(--glass-border);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.2rem;
    cursor: pointer;
}

.order-type-display {
    background: var(--bg-dark);
    padding: 0.8rem 1rem;
    border-radius: 12px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: var(--text-muted);
}
.highlight-text {
    color: var(--primary);
    font-weight: 800;
    margin-left: 0.5rem;
    font-size: 1.1rem;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 1.5rem;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 0;
    border-bottom: 1px solid var(--glass-border);
}

.cart-item-name {
    font-weight: 600;
    margin-bottom: 0.3rem;
}

.cart-item-price {
    color: var(--primary);
    font-weight: 800;
}

.cart-footer {
    border-top: 1px solid var(--glass-border);
    padding-top: 1.5rem;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
}

.btn-primary {
    background: var(--primary);
    color: white;
    border: none;
    width: 100%;
    padding: 1rem;
    border-radius: 16px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition);
}

.btn-primary:active {
    transform: scale(0.98);
}

/* =========================================================
   Success Screen 
========================================================= */
.success-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-dark);
    z-index: 200;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
}

.success-screen.active {
    opacity: 1;
    pointer-events: all;
}

.success-content {
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    transform: translateY(20px);
    transition: transform 0.4s;
}
.success-screen.active .success-content {
    transform: translateY(0);
}

.success-icon i {
    font-size: 6rem;
    color: #4CAF50;
    animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes scaleIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.order-id {
    font-size: 1.1rem;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 1rem 1.5rem;
    border-radius: 12px;
    border: 1px dashed var(--glass-border);
    margin: 0.5rem 0;
    width: 100%;
}
.order-id span {
    color: white;
    font-weight: 800;
}

.btn-secondary {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 1rem 2rem;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition);
    margin-top: 1rem;
}

.btn-secondary:active {
    background: rgba(255, 90, 0, 0.1);
}

</style>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <!-- Main Application Page -->
    <div id="main-page">
        <!-- Home / Hero Section -->
        <header class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="brand-title">Bhukad Hut</h1>
                <p class="brand-subtitle">Hapur's Favorite Spot</p>
            </div>
        </header>

        <!-- Order Type Toggle -->
        <div class="order-type-container">
            <div class="order-type-toggle">
                <button class="toggle-btn active" id="btn-dine-in" onclick="setOrderType('Dine-In')">
                    <i class="ph ph-fork-knife"></i> Dine In
                </button>
                <button class="toggle-btn" id="btn-takeaway" onclick="setOrderType('Takeaway')">
                    <i class="ph ph-tote"></i> Takeaway
                </button>
            </div>
        </div>

        <!-- Category Scroll -->
        <div class="categories-wrapper">
            <div class="categories" id="categories-container">
                <!-- Categories injected by JS -->
            </div>
        </div>

        <!-- Menu Items List -->
        <main class="menu-container" id="menu-container">
            <!-- Items injected by JS -->
        </main>
        
        <div class="spacer"></div>
    </div>

    <!-- Floating Cart Bar -->
    <div id="cart-bar" class="cart-bar hidden" onclick="toggleCartModal()">
        <div class="cart-info">
            <i class="ph ph-shopping-cart"></i>
            <span id="cart-count">0 items</span>
        </div>
        <div class="cart-total">
            <span id="cart-total-price">₹0</span>
            <i class="ph ph-caret-up"></i>
        </div>
    </div>

    <!-- Cart Modal Screen -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h2>Your Order</h2>
                <button class="close-btn" onclick="toggleCartModal()">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            
            <div class="order-type-display">
                Order Type: <span id="modal-order-type" class="highlight-text">Dine-In</span>
            </div>

            <div class="cart-items" id="cart-items-container">
                <!-- Cart Items injected by JS -->
            </div>
            <div class="cart-footer">
                <div class="total-row">
                    <span>Total Amount</span>
                    <strong id="modal-total-price">₹0</strong>
                </div>
                <button class="btn-primary" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <!-- Order Success Screen -->
    <div id="success-screen" class="success-screen hidden">
        <div class="success-content">
            <div class="success-icon">
                <i class="ph-fill ph-check-circle"></i>
            </div>
            <h2>Order Placed!</h2>
            <p>Your order has been successfully recorded.</p>
            <p class="order-id">Order ID: <span id="random-order-id"></span></p>
            <p class="order-id">Type: <span id="success-order-type"></span></p>
            <button class="btn-secondary" onclick="startNewOrder()">Start New Order</button>
        </div>
    </div>

    <script>
// Menu Data
const menuData = [
    { id: 1, name: "Veg Momos", desc: "Steamed dumplings with fresh veggies.", price: 80, category: "Fast Food" },
    { id: 2, name: "Chicken Momos", desc: "Juicy steamed dumplings stuffed with minced chicken.", price: 120, category: "Fast Food" },
    { id: 3, name: "Kurkure Momos", desc: "Crispy fried momos tossed in special spices.", price: 140, category: "Fast Food" },
    { id: 4, name: "Paneer Roll", desc: "Spicy paneer tikka wrapped in a soft paratha.", price: 110, category: "Rolls" },
    { id: 5, name: "Chicken Egg Roll", desc: "Double egg and spicy chicken chunks wrapped together.", price: 150, category: "Rolls" },
    { id: 6, name: "White Sauce Pasta", desc: "Creamy cheesy pasta with herbs and olives.", price: 180, category: "Pasta" },
    { id: 7, name: "Red Sauce Pasta", desc: "Tangy tomato arrabbiata pasta with exotic veggies.", price: 160, category: "Pasta" },
    { id: 8, name: "Grilled Sandwich", desc: "Stuffed with cheese, corn, and capsicum.", price: 90, category: "Sandwich" },
    { id: 9, name: "Chicken Tikka Sandwich", desc: "Loaded with grilled chicken and tandoori mayo.", price: 130, category: "Sandwich" },
    { id: 10, name: "Cold Coffee", desc: "Classic thick cold coffee with a scoop of vanilla.", price: 100, category: "Beverages" },
    { id: 11, name: "Virgin Mojito", desc: "Refreshing mint and lemon cooler.", price: 90, category: "Beverages" }
];

// App State
let currentOrderType = 'Dine-In'; // 'Dine-In' or 'Takeaway'
let activeCategory = 'All';
let cart = {}; // { itemId: quantity }

// Elements
const categoriesContainer = document.getElementById('categories-container');
const menuContainer = document.getElementById('menu-container');
const btnDineIn = document.getElementById('btn-dine-in');
const btnTakeaway = document.getElementById('btn-takeaway');
const cartBar = document.getElementById('cart-bar');
const cartCount = document.getElementById('cart-count');
const cartTotalPrice = document.getElementById('cart-total-price');
const cartModal = document.getElementById('cart-modal');
const cartItemsContainer = document.getElementById('cart-items-container');
const modalTotalPrice = document.getElementById('modal-total-price');
const modalOrderType = document.getElementById('modal-order-type');
const successScreen = document.getElementById('success-screen');

// Initialize
function init() {
    renderCategories();
    renderMenu();
}

// Order Type Toggle
function setOrderType(type) {
    currentOrderType = type;
    
    // Update Buttons
    if (type === 'Dine-In') {
        btnDineIn.classList.add('active');
        btnTakeaway.classList.remove('active');
    } else {
        btnTakeaway.classList.add('active');
        btnDineIn.classList.remove('active');
    }
}

// Menu Functions
function renderCategories() {
    const categories = ['All', ...new Set(menuData.map(item => item.category))];
    categoriesContainer.innerHTML = '';
    
    categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-btn ${activeCategory === cat ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
            activeCategory = cat;
            renderCategories(); // Re-render to update active class
            renderMenu();
        };
        categoriesContainer.appendChild(btn);
    });
}

function renderMenu() {
    menuContainer.innerHTML = '';
    
    const filteredMenu = activeCategory === 'All' 
        ? menuData 
        : menuData.filter(item => item.category === activeCategory);
        
    filteredMenu.forEach(item => {
        const qty = cart[item.id] || 0;
        
        const itemEl = document.createElement('div');
        itemEl.className = 'menu-item';
        
        let actionHTML = '';
        if (qty === 0) {
            actionHTML = `<button class="add-init-btn" onclick="updateCart(${item.id}, 1)">Add</button>`;
        } else {
            actionHTML = `
                <div class="qty-control">
                    <button class="qty-btn" onclick="updateCart(${item.id}, -1)"><i class="ph ph-minus"></i></button>
                    <span class="qty-display">${qty}</span>
                    <button class="qty-btn add-btn" onclick="updateCart(${item.id}, 1)"><i class="ph ph-plus"></i></button>
                </div>
            `;
        }
        
        itemEl.innerHTML = `
            <div class="menu-item-info">
                <h3 class="menu-item-title">${item.name}</h3>
                <p class="menu-item-desc">${item.desc}</p>
                <div class="menu-item-price">₹${item.price}</div>
            </div>
            <div class="menu-item-action" id="action-${item.id}">
                ${actionHTML}
            </div>
        `;
        
        menuContainer.appendChild(itemEl);
    });
}

// Cart Functions
function updateCart(itemId, change) {
    if (!cart[itemId]) cart[itemId] = 0;
    
    cart[itemId] += change;
    
    if (cart[itemId] <= 0) {
        delete cart[itemId];
    }
    
    renderMenu(); // Update UI buttons
    updateCartBar();
    
    // If modal is open, update it
    if (cartModal.classList.contains('open')) {
        renderCartModal();
        if (Object.keys(cart).length === 0) {
            toggleCartModal(); // close if empty
        }
    }
}

function updateCartBar() {
    const itemIds = Object.keys(cart);
    let totalItems = 0;
    let totalPrice = 0;
    
    itemIds.forEach(id => {
        const qty = cart[id];
        const item = menuData.find(i => i.id === parseInt(id));
        totalItems += qty;
        totalPrice += (qty * item.price);
    });
    
    if (totalItems > 0) {
        cartCount.textContent = `${totalItems} item${totalItems > 1 ? 's' : ''}`;
        cartTotalPrice.textContent = `₹${totalPrice}`;
        cartBar.classList.remove('hidden');
    } else {
        cartBar.classList.add('hidden');
    }
}

function toggleCartModal() {
    if (Object.keys(cart).length === 0) return;
    
    if (cartModal.classList.contains('open')) {
        cartModal.classList.remove('open');
    } else {
        renderCartModal();
        cartModal.classList.add('open');
    }
}

function renderCartModal() {
    cartItemsContainer.innerHTML = '';
    let totalPrice = 0;
    
    modalOrderType.textContent = currentOrderType;
    
    Object.keys(cart).forEach(id => {
        const qty = cart[id];
        const item = menuData.find(i => i.id === parseInt(id));
        totalPrice += (qty * item.price);
        
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
            <div>
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">₹${item.price}</div>
            </div>
            <div class="qty-control">
                <button class="qty-btn" onclick="updateCart(${item.id}, -1)"><i class="ph ph-minus"></i></button>
                <span class="qty-display">${qty}</span>
                <button class="qty-btn add-btn" onclick="updateCart(${item.id}, 1)"><i class="ph ph-plus"></i></button>
            </div>
        `;
        cartItemsContainer.appendChild(row);
    });
    
    modalTotalPrice.textContent = `₹${totalPrice}`;
}

// Order Logic
function placeOrder() {
    toggleCartModal();
    const orderId = Math.floor(100000 + Math.random() * 900000);
    document.getElementById('random-order-id').textContent = `#BH-${orderId}`;
    document.getElementById('success-order-type').textContent = currentOrderType;
    successScreen.classList.add('active');
    cartBar.classList.add('hidden');
}

function startNewOrder() {
    cart = {};
    activeCategory = 'All';
    updateCartBar();
    successScreen.classList.remove('active');
    init(); // reset menu UI
    
    // Scroll back to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Start app
init();

</script>
</body>
</html>
